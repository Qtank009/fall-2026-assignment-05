<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="springsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="springSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="springsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#springsGlow)" />

  <g filter="url(#springsShadow)">
    <rect x="90" y="110" width="420" height="380" rx="16" fill="#0c1322" stroke="#0284c7" stroke-width="2" />
    <rect x="110" y="130" width="380" height="340" rx="10" fill="#060913" stroke="#1e293b" stroke-width="1.5" />

    <!-- Label -->
    <rect x="130" y="145" width="340" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="145" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.06em">mag² TENSION SPRING SYSTEM</text>
    <text x="455" y="168" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="end">3 STIFFNESSES</text>

    <!-- 3 Sets of Springs: Soft (0.6N), Balanced (0.8N), Stiff (1.0N) -->
    <!-- Soft Springs Column -->
    <g transform="translate(130, 200)">
      <rect x="0" y="0" width="95" height="190" rx="8" fill="#0b1528" stroke="#1e3a8a" stroke-width="1" />
      <text x="47" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">SOFT 0.6N</text>
      <!-- Spring Graphic -->
      <path d="M 32,50 Q 62,60 32,70 Q 62,80 32,90 Q 62,100 32,110 Q 62,120 32,130 Q 62,140 32,150" fill="none" stroke="url(#springSteel)" stroke-width="4.5" stroke-linecap="round" />
      <!-- Washer -->
      <ellipse cx="47" cy="168" rx="20" ry="6" fill="#60a5fa" stroke="#93c5fd" stroke-width="1.5" />
    </g>

    <!-- Balanced Springs Column -->
    <g transform="translate(252, 200)">
      <rect x="0" y="0" width="95" height="190" rx="8" fill="#0b1528" stroke="#0284c7" stroke-width="1" />
      <text x="47" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">MID 0.8N</text>
      <!-- Spring Graphic (Tighter coils) -->
      <path d="M 32,48 Q 62,56 32,64 Q 62,72 32,80 Q 62,88 32,96 Q 62,104 32,112 Q 62,120 32,128 Q 62,136 32,144 Q 62,152 32,160" fill="none" stroke="url(#springSteel)" stroke-width="5" stroke-linecap="round" />
      <!-- Washer -->
      <ellipse cx="47" cy="172" rx="20" ry="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    </g>

    <!-- Stiff Springs Column -->
    <g transform="translate(375, 200)">
      <rect x="0" y="0" width="95" height="190" rx="8" fill="#0b1528" stroke="#0369a1" stroke-width="1" />
      <text x="47" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle">FIRM 1.0N</text>
      <!-- Spring Graphic (Heavy wire) -->
      <path d="M 30,46 Q 64,54 30,62 Q 64,70 30,78 Q 64,86 30,94 Q 64,102 30,110 Q 64,118 30,126 Q 64,134 30,142 Q 64,150 30,158" fill="none" stroke="url(#springSteel)" stroke-width="6.5" stroke-linecap="round" />
      <!-- Washer -->
      <ellipse cx="47" cy="172" rx="20" ry="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    </g>

    <!-- Bottom Specs -->
    <text x="300" y="425" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">12× 304 STAINLESS COMPRESSION SPRINGS</text>
    <text x="300" y="450" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">6× CNC ANODIZED STEP WASHERS INCLUDED</text>
  </g>
</svg>
