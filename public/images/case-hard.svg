<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="caseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="caseShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="caseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#caseGlow)" />
  <ellipse cx="300" cy="495" rx="190" ry="28" fill="#000000" opacity="0.8" />

  <g filter="url(#caseShadow)">
    <!-- Top Carry Lanyard Loop -->
    <path d="M 270,110 Q 300,70 330,110" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <!-- Metallic Carabiner Ring -->
    <circle cx="300" cy="85" r="14" fill="none" stroke="#cbd5e1" stroke-width="4" />

    <!-- Main Clamshell Body -->
    <rect x="120" y="120" width="360" height="360" rx="36" fill="url(#caseShell)" stroke="#334155" stroke-width="3" />

    <!-- Center Perimeter Zipper Track -->
    <rect x="117" y="294" width="366" height="12" rx="3" fill="#090d16" stroke="#475569" stroke-width="1" />
    <!-- Zipper Teeth Marks -->
    <g stroke="#64748b" stroke-width="1.5">
      <line x1="140" y1="294" x2="140" y2="306" /><line x1="160" y1="294" x2="160" y2="306" />
      <line x1="180" y1="294" x2="180" y2="306" /><line x1="200" y1="294" x2="200" y2="306" />
      <line x1="220" y1="294" x2="220" y2="306" /><line x1="240" y1="294" x2="240" y2="306" />
      <line x1="260" y1="294" x2="260" y2="306" /><line x1="280" y1="294" x2="280" y2="306" />
      <line x1="300" y1="294" x2="300" y2="306" /><line x1="320" y1="294" x2="320" y2="306" />
      <line x1="340" y1="294" x2="340" y2="306" /><line x1="360" y1="294" x2="360" y2="306" />
      <line x1="380" y1="294" x2="380" y2="306" /><line x1="400" y1="294" x2="400" y2="306" />
      <line x1="420" y1="294" x2="420" y2="306" /><line x1="440" y1="294" x2="440" y2="306" />
      <line x1="460" y1="294" x2="460" y2="306" />
    </g>

    <!-- Metal Zipper Pull -->
    <rect x="440" y="300" width="28" height="40" rx="4" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="454" cy="326" r="4" fill="#0f172a" />

    <!-- Molded Geometric Relief on Front Shell (Stylized Speedcube Silhouette) -->
    <polygon points="300,165 375,208 300,250 225,208" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <polygon points="225,208 300,250 300,285 225,245" fill="#172554" stroke="#2563eb" stroke-width="1.5" />
    <polygon points="300,250 375,208 375,245 300,285" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.5" />

    <!-- Lower Embossed Rubber Badge -->
    <rect x="230" y="360" width="140" height="45" rx="6" fill="#090e1a" stroke="#2563eb" stroke-width="1.5" />
    <text x="300" y="388" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.1em">mag² VAULT</text>

    <!-- Corner Reinforced Rubber Bumpers -->
    <circle cx="155" cy="155" r="12" fill="#0a0f1d" stroke="#334155" stroke-width="2" />
    <circle cx="445" cy="155" r="12" fill="#0a0f1d" stroke="#334155" stroke-width="2" />
    <circle cx="155" cy="445" r="12" fill="#0a0f1d" stroke="#334155" stroke-width="2" />
    <circle cx="445" cy="445" r="12" fill="#0a0f1d" stroke="#334155" stroke-width="2" />
  </g>
</svg>
