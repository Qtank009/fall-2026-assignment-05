<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="twoTwoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#1e3a8a" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="topSilver2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="leftSilver2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="rightSilver2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="80%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="floorShadow4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <filter id="cubeDropShadow4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <circle cx="300" cy="285" r="260" fill="url(#twoTwoGlow)" />
  <ellipse cx="300" cy="485" rx="195" ry="34" fill="#000000" opacity="0.75" filter="url(#floorShadow4)" />

  <g filter="url(#cubeDropShadow4)">
    <!-- Base Core -->
    <polygon points="300,105 450,195 300,285 150,195" fill="#080d1a" stroke="#080d1a" stroke-width="2" />
    <polygon points="150,195 300,285 300,455 150,365" fill="#060913" stroke="#060913" stroke-width="2" />
    <polygon points="300,285 450,195 450,365 300,455" fill="#04060d" stroke="#04060d" stroke-width="2" />

    <!-- 2x2 Top Face (4 Pieces) -->
    <g stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-linejoin="round">
      <!-- Back Corner (300,105) -->
      <path d="M 300,105 L 229,147 L 300,190 L 371,147 Z" fill="url(#topSilver2)" />
      <!-- Left Corner (150,195) -->
      <path d="M 223,151 L 150,195 L 223,239 L 295,195 Z" fill="url(#topSilver2)" />
      <!-- Right Corner (450,195) -->
      <path d="M 377,151 L 305,195 L 377,239 L 450,195 Z" fill="url(#topSilver2)" />
      <!-- Front Corner (300,285) -->
      <path d="M 300,200 L 229,243 L 300,285 L 371,243 Z" fill="url(#topSilver2)" />
    </g>

    <!-- 2x2 Left Face (4 Pieces) -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="1.4" stroke-linejoin="round">
      <path d="M 150,195 L 223,239 L 223,322 L 150,278 Z" fill="url(#leftSilver2)" />
      <path d="M 227,242 L 300,285 L 300,368 L 227,325 Z" fill="url(#leftSilver2)" />
      <path d="M 150,283 L 223,327 L 223,410 L 150,365 Z" fill="url(#leftSilver2)" />
      <path d="M 227,330 L 300,373 L 300,455 L 227,413 Z" fill="url(#leftSilver2)" />
    </g>

    <!-- 2x2 Right Face (4 Pieces) -->
    <g stroke="rgba(255,255,255,0.2)" stroke-width="1.4" stroke-linejoin="round">
      <path d="M 300,285 L 373,242 L 373,325 L 300,368 Z" fill="url(#rightSilver2)" />
      <path d="M 377,239 L 450,195 L 450,278 L 377,322 Z" fill="url(#rightSilver2)" />
      <path d="M 300,373 L 373,330 L 373,413 L 300,455 Z" fill="url(#rightSilver2)" />
      <path d="M 377,325 L 450,283 L 450,365 L 377,408 Z" fill="url(#rightSilver2)" />
    </g>

    <!-- Center Logo -->
    <text x="300" y="196" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#64748b" opacity="0.75" text-anchor="middle" transform="rotate(30 300 196) skewX(-30)">mag² 2×2</text>
  </g>
</svg>
