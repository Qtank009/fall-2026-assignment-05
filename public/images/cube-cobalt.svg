      <path d="M 365.5,302.0 L 390.5,287.6 Q 399.8,282.2 399.8,293.0 L 399.8,321.8 Q 399.8,332.6 390.5,338.0 L 365.5,352.4 Q 356.2,357.8 356.2,347.0 L 356.2,318.2 Q 356.2,307.4 365.5,302.0 Z" fill="url(#rightCobalt)" />
      <path d="M 417.5,272.0 L 456.0,249.8 L 456.0,300.2 L 417.5,322.4 Q 408.2,327.8 408.2,317.0 L 408.2,288.2 Q 408.2,277.4 417.5,272.0 Z" fill="url(#rightCobalt)" />
      <path d="M 300.0,399.8 L 300.0,455.0 L 347.8,427.4 L 347.8,383.0 Q 347.8,372.2 338.5,377.6 Z" fill="url(#rightCobalt)" />
      <path d="M 356.2,378.2 Q 356.2,367.4 365.5,362.0 L 390.5,347.6 Q 399.8,342.2 399.8,353.0 L 399.8,397.4 L 356.2,422.6 Z" fill="url(#rightCobalt)" />
      <path d="M 408.2,348.2 Q 408.2,337.4 417.5,332.0 L 456.0,309.8 L 456.0,365.0 L 408.2,392.6 Z" fill="url(#rightCobalt)" />
    </g>

    <!-- Center logo text -->
    <text x="298" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" opacity="0.85" text-anchor="middle" transform="rotate(30 298 190) skewX(-30)">mag²</text>
  </g>
</svg>
