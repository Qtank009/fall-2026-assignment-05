<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cobaltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#1d4ed8" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#0b1730" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Top Face Gradient: Anodized Cobalt Light -->
    <linearGradient id="topCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="30%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Left Face Gradient: Directional Cobalt Deep Slate -->
    <linearGradient id="leftCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#1e40af" />
      <stop offset="80%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Right Face Gradient: Shadow Cobalt -->
    <linearGradient id="rightCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="80%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <filter id="floorShadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <filter id="cubeDropShadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <circle cx="300" cy="285" r="260" fill="url(#cobaltGlow)" />
  <ellipse cx="300" cy="485" rx="195" ry="34" fill="#000000" opacity="0.75" filter="url(#floorShadow2)" />

  <g filter="url(#cubeDropShadow2)">
    <polygon points="300,95 456,185 300,275 144,185" fill="#050a17" stroke="#050a17" stroke-width="2" />
    <polygon points="144,185 300,275 300,455 144,365" fill="#040710" stroke="#040710" stroke-width="2" />
    <polygon points="300,275 456,185 456,365 300,455" fill="#020408" stroke="#020408" stroke-width="2" />

    <!-- Top Face Pieces -->
    <g stroke="rgba(147,197,253,0.5)" stroke-width="1.2" stroke-linejoin="round">
      <path d="M 300.0,95.0 L 252.2,122.6 L 290.7,144.8 Q 300.0,150.2 309.3,144.8 L 347.8,122.6 Z" fill="url(#topCobalt)" />
      <path d="M 243.8,127.4 L 200.2,152.6 L 238.7,174.8 Q 248.0,180.2 257.3,174.8 L 282.3,160.4 Q 291.6,155.0 282.3,149.6 Z" fill="url(#topCobalt)" />
      <path d="M 191.8,157.4 L 144.0,185.0 L 191.8,212.6 L 230.3,190.4 Q 239.6,185.0 230.3,179.6 Z" fill="url(#topCobalt)" />
      <path d="M 356.2,127.4 L 317.7,149.6 Q 308.4,155.0 317.7,160.4 L 342.7,174.8 Q 352.0,180.2 361.3,174.8 L 399.8,152.6 Z" fill="url(#topCobalt)" />
      <path d="M 290.7,165.2 L 265.7,179.6 Q 256.4,185.0 265.7,190.4 L 290.7,204.8 Q 300.0,210.2 309.3,204.8 L 334.3,190.4 Q 343.6,185.0 334.3,179.6 L 309.3,165.2 Q 300.0,159.8 290.7,165.2 Z" fill="#60a5fa" />
      <path d="M 257.3,195.2 L 282.3,209.6 Q 291.6,215.0 282.3,220.4 L 243.8,242.6 L 200.2,217.4 L 238.7,195.2 Q 248.0,189.8 257.3,195.2 Z" fill="url(#topCobalt)" />
      <path d="M 408.2,157.4 L 456.0,185.0 L 408.2,212.6 L 369.7,190.4 Q 360.4,185.0 369.7,179.6 Z" fill="url(#topCobalt)" />
      <path d="M 361.3,195.2 Q 352.0,189.8 342.7,195.2 L 317.7,209.6 Q 308.4,215.0 317.7,220.4 L 356.2,242.6 L 399.8,217.4 Z" fill="url(#topCobalt)" />
      <path d="M 290.7,225.2 Q 300.0,219.8 309.3,225.2 L 347.8,247.4 L 300.0,275.0 L 252.2,247.4 Z" fill="url(#topCobalt)" />
    </g>

