    <g stroke="rgba(147,197,253,0.3)" stroke-width="1.2" stroke-linejoin="round">
      <path d="M 144.0,185.0 L 191.8,212.6 L 191.8,257.0 Q 191.8,267.8 182.5,262.4 L 144.0,240.2 Z" fill="url(#leftCobalt)" />
      <path d="M 200.2,217.4 L 243.8,242.6 L 243.8,287.0 Q 243.8,297.8 234.5,292.4 L 209.5,278.0 Q 200.2,272.6 200.2,261.8 Z" fill="url(#leftCobalt)" />
      <path d="M 252.2,247.4 L 300.0,275.0 L 300.0,330.2 L 261.5,308.0 Q 252.2,302.6 252.2,291.8 Z" fill="url(#leftCobalt)" />
      <path d="M 144.0,249.8 L 182.5,272.0 Q 191.8,277.4 191.8,288.2 L 191.8,317.0 Q 191.8,327.8 182.5,322.4 L 144.0,300.2 Z" fill="url(#leftCobalt)" />
      <path d="M 209.5,287.6 L 234.5,302.0 Q 243.8,307.4 243.8,318.2 L 243.8,347.0 Q 243.8,357.8 234.5,352.4 L 209.5,338.0 Q 200.2,332.6 200.2,321.8 L 200.2,293.0 Q 200.2,282.2 209.5,287.6 Z" fill="url(#leftCobalt)" />
      <path d="M 261.5,317.6 L 300.0,339.8 L 300.0,390.2 L 261.5,368.0 Q 252.2,362.6 252.2,351.8 L 252.2,323.0 Q 252.2,312.2 261.5,317.6 Z" fill="url(#leftCobalt)" />
      <path d="M 144.0,309.8 L 144.0,365.0 L 191.8,392.6 L 191.8,348.2 Q 191.8,337.4 182.5,332.0 Z" fill="url(#leftCobalt)" />
      <path d="M 200.2,397.4 L 243.8,422.6 L 243.8,378.2 Q 243.8,367.4 234.5,362.0 L 209.5,347.6 Q 200.2,342.2 200.2,353.0 Z" fill="url(#leftCobalt)" />
      <path d="M 252.2,427.4 L 300.0,455.0 L 300.0,399.8 L 261.5,377.6 Q 252.2,372.2 252.2,383.0 Z" fill="url(#leftCobalt)" />
    </g>

    <!-- Right Face Pieces -->
    <g stroke="rgba(147,197,253,0.2)" stroke-width="1.2" stroke-linejoin="round">
      <path d="M 300.0,275.0 L 347.8,247.4 L 347.8,291.8 Q 347.8,302.6 338.5,308.0 L 300.0,330.2 Z" fill="url(#rightCobalt)" />
      <path d="M 356.2,242.6 L 399.8,217.4 L 399.8,261.8 Q 399.8,272.6 390.5,278.0 L 365.5,292.4 Q 356.2,297.8 356.2,287.0 Z" fill="url(#rightCobalt)" />
      <path d="M 408.2,212.6 L 456.0,185.0 L 456.0,240.2 L 417.5,262.4 Q 408.2,267.8 408.2,257.0 Z" fill="url(#rightCobalt)" />
