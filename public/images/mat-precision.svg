<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="matGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="matShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#matGlow)" />

  <g filter="url(#matShadow)">
    <!-- Perspective Desk Neoprene Mat -->
    <polygon points="120,160 480,160 540,440 60,440" fill="#090e1a" stroke="#1d4ed8" stroke-width="2.5" />
    <!-- Stitched Edge Perimeter (Blue Thread) -->
    <polygon points="125,166 475,166 532,434 68,434" fill="#070a13" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Timer Docking Cutouts (Top Center) -->
    <rect x="250" y="175" width="100" height="24" rx="4" fill="#030712" stroke="#60a5fa" stroke-width="1.2" />
    <circle cx="270" cy="187" r="4" fill="#93c5fd" />
    <circle cx="330" cy="187" r="4" fill="#93c5fd" />
    <text x="300" y="191" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">TIMER DOCK</text>

    <!-- Hand Placement Touch Sensor Zones -->
    <!-- Left Hand Sensor -->
    <rect x="110" y="320" width="110" height="85" rx="14" fill="#0d1933" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 145,340 C 145,340 160,330 175,340 C 175,355 185,365 175,385 C 160,385 145,385 145,385 Z" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6" />
    <text x="165" y="375" font-family="monospace" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">LEFT</text>

    <!-- Right Hand Sensor -->
    <rect x="380" y="320" width="110" height="85" rx="14" fill="#0d1933" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 415,340 C 415,340 430,330 445,340 C 445,355 455,365 445,385 C 430,385 415,385 415,385 Z" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6" />
    <text x="435" y="375" font-family="monospace" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">RIGHT</text>

    <!-- Central Cube Inspection Target Box -->
    <rect x="250" y="240" width="100" height="100" rx="6" fill="#0b1325" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="300" cy="290" r="30" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4" />
    <polygon points="300,270 315,290 300,310 285,290" fill="none" stroke="#93c5fd" stroke-width="1.5" />
    <text x="300" y="294" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">mag²</text>

    <!-- Subtle Mat Coordinates & Markings -->
    <line x1="80" y1="410" x2="520" y2="410" stroke="#1e293b" stroke-width="1" />
    <text x="300" y="425" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">WCA REGULATION DIMENSIONS &bull; 850mm &times; 350mm &bull; 4mm HIGH-DENSITY RUBBER</text>
  </g>
</svg>
