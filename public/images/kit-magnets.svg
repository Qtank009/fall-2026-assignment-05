<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="magnetKitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="silverMagnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="kitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#magnetKitGlow)" />

  <g filter="url(#kitShadow)">
    <!-- Aluminum Clamshell Case -->
    <rect x="90" y="110" width="420" height="380" rx="16" fill="#0b1324" stroke="#2563eb" stroke-width="2" />
    
    <!-- Inner Foam Cushion -->
    <rect x="110" y="130" width="380" height="340" rx="10" fill="#050811" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top Branding Plate -->
    <rect x="130" y="145" width="340" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="145" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.06em">mag² N52 CORE TUNING SYSTEM</text>
    <text x="455" y="168" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="end">24× CAPSULES</text>

    <!-- 24 Precision Magnet Cylinders in a 6x4 Grid -->
    <!-- Row 1 -->
    <g fill="url(#silverMagnet)" stroke="#ffffff" stroke-width="0.8">
      <circle cx="160" cy="220" r="14" /><circle cx="215" cy="220" r="14" /><circle cx="270" cy="220" r="14" />
      <circle cx="325" cy="220" r="14" /><circle cx="380" cy="220" r="14" /><circle cx="435" cy="220" r="14" />
      <!-- Row 2 -->
      <circle cx="160" cy="265" r="14" /><circle cx="215" cy="265" r="14" /><circle cx="270" cy="265" r="14" />
      <circle cx="325" cy="265" r="14" /><circle cx="380" cy="265" r="14" /><circle cx="435" cy="265" r="14" />
      <!-- Row 3 -->
      <circle cx="160" cy="310" r="14" /><circle cx="215" cy="310" r="14" /><circle cx="270" cy="310" r="14" />
      <circle cx="325" cy="310" r="14" /><circle cx="380" cy="310" r="14" /><circle cx="435" cy="310" r="14" />
      <!-- Row 4 -->
      <circle cx="160" cy="355" r="14" /><circle cx="215" cy="355" r="14" /><circle cx="270" cy="355" r="14" />
      <circle cx="325" cy="355" r="14" /><circle cx="380" cy="355" r="14" /><circle cx="435" cy="355" r="14" />
    </g>

    <!-- Metallic Specular Highlights on Magnets -->
    <g fill="#ffffff" opacity="0.6">
      <circle cx="156" cy="216" r="4" /><circle cx="211" cy="216" r="4" /><circle cx="266" cy="216" r="4" />
      <circle cx="321" cy="216" r="4" /><circle cx="376" cy="216" r="4" /><circle cx="431" cy="216" r="4" />
      <circle cx="156" cy="261" r="4" /><circle cx="211" cy="261" r="4" /><circle cx="266" cy="261" r="4" />
      <circle cx="321" cy="261" r="4" /><circle cx="376" cy="261" r="4" /><circle cx="431" cy="261" r="4" />
      <circle cx="156" cy="306" r="4" /><circle cx="211" cy="306" r="4" /><circle cx="266" cy="306" r="4" />
      <circle cx="321" cy="306" r="4" /><circle cx="376" cy="306" r="4" /><circle cx="431" cy="306" r="4" />
      <circle cx="156" cy="351" r="4" /><circle cx="211" cy="351" r="4" /><circle cx="266" cy="351" r="4" />
      <circle cx="321" cy="351" r="4" /><circle cx="376" cy="351" r="4" /><circle cx="431" cy="351" r="4" />
    </g>

    <!-- Adjustment Driver Tool Slot -->
    <rect x="130" y="395" width="340" height="50" rx="6" fill="#090d16" stroke="#2563eb" stroke-width="1" />
    <!-- Tool handle and shaft -->
    <rect x="150" y="415" width="160" height="12" rx="3" fill="#3b82f6" />
    <rect x="310" y="418" width="120" height="6" fill="#cbd5e1" />
    <polygon points="430,418 445,421 430,424" fill="#94a3b8" />
    <!-- Knurling on driver handle -->
    <line x1="170" y1="415" x2="170" y2="427" stroke="#1d4ed8" stroke-width="2" />
    <line x1="185" y1="415" x2="185" y2="427" stroke="#1d4ed8" stroke-width="2" />
    <line x1="200" y1="415" x2="200" y2="427" stroke="#1d4ed8" stroke-width="2" />
    <line x1="215" y1="415" x2="215" y2="427" stroke="#1d4ed8" stroke-width="2" />
    <line x1="230" y1="415" x2="230" y2="427" stroke="#1d4ed8" stroke-width="2" />
    <line x1="245" y1="415" x2="245" y2="427" stroke="#1d4ed8" stroke-width="2" />

    <text x="300" y="460" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">PRECISION N52 GRADIENT: 3.5mm &times; 1.5mm &bull; CNC TORX TOOL</text>
  </g>
</svg>
