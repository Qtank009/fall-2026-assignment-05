<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="standGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#60a5fa" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="billetSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="billetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="standShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#standGlow)" />
  <ellipse cx="300" cy="490" rx="180" ry="32" fill="#000000" opacity="0.8" />

  <g filter="url(#standShadow)">
    <!-- Base Triangular Pedestal Bottom Chamfer -->
    <polygon points="300,470 120,380 480,380" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <polygon points="300,455 130,370 470,370" fill="url(#billetDark)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Pedestal Central Tier -->
    <polygon points="300,430 160,350 440,350" fill="url(#billetSilver)" stroke="#ffffff" stroke-width="1.2" />

    <!-- 3 Upright Supporting Prongs (Prong 1: Back/Left, Prong 2: Back/Right, Prong 3: Front/Center) -->
    <!-- Left Pillar -->
    <polygon points="180,350 200,350 220,200 190,200" fill="url(#billetDark)" stroke="#94a3b8" stroke-width="1" />
    <polygon points="190,200 220,200 205,170" fill="#e2e8f0" />

    <!-- Right Pillar -->
    <polygon points="400,350 420,350 410,200 380,200" fill="url(#billetDark)" stroke="#94a3b8" stroke-width="1" />
    <polygon points="380,200 410,200 395,170" fill="#e2e8f0" />

    <!-- Center Front Pillar -->
    <polygon points="285,380 315,380 325,260 275,260" fill="url(#billetSilver)" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="275,260 325,260 300,230" fill="#ffffff" />

    <!-- Laser Engraved Logo Plate -->
    <rect x="240" y="380" width="120" height="30" rx="3" fill="#090e1a" stroke="#3b82f6" stroke-width="1" />
    <text x="300" y="400" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.1em">mag²</text>

    <!-- Holographic Ghost Speedcube resting on stand -->
    <polygon points="300,90 380,140 300,190 220,140" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
    <polygon points="220,140 300,190 300,280 220,230" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
    <polygon points="300,190 380,140 380,230 300,280" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  </g>
</svg>
